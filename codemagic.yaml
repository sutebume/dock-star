workflows:
  ios-release:
    name: Dock Star iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dockstar.game
      groups:
        - apple_credentials
        # Holds ALLOW_TEST_ADS. Set it to "true" in the Codemagic UI to build
        # with Google placeholder ads (visible on TestFlight); set it to
        # "false" for a release build, which then forces TEST_ADS=false in
        # js/ads.js. See scripts/check-ads-mode.js.
        - ads_testing
      vars:
        BUNDLE_ID: "com.dockstar.game"
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
      node: 22.13.0
      xcode: latest
    scripts:
      - name: Install npm dependencies and Capacitor iOS
        script: |
          npm install
          npm install @capacitor/ios
      - name: Check ad mode (blocks accidental test-ads release)
        script: |
          node scripts/check-ads-mode.js
      - name: Add and sync iOS platform
        script: |
          npm run build:www
          npx cap add ios
          npx cap sync ios
      - name: Restrict to iPhone only
        script: |
          # Capacitor generates a universal app (device family "1,2"). Shipping
          # iPhone-only avoids untested iPad layouts and the iPad screenshot
          # requirement. iPad support can be added later; Apple does not allow
          # removing device support from an already-published app.
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PBX"
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "$PBX"; then
            echo "ERROR: device family still universal - Capacitor project format changed"
            grep -n 'TARGETED_DEVICE_FAMILY' "$PBX"
            exit 1
          fi
          echo "Device family set to iPhone only:"
          grep -n 'TARGETED_DEVICE_FAMILY' "$PBX"
      - name: Configure Info.plist
        script: |
          plutil -insert ITSAppUsesNonExemptEncryption -bool false ios/App/App/Info.plist
          plutil -insert GADApplicationIdentifier -string "ca-app-pub-9105653107748286~1268068332" ios/App/App/Info.plist
          plutil -replace CFBundleVersion -string "$BUILD_NUMBER" ios/App/App/Info.plist
      - name: Generate iOS app icon
        script: |
          # @capacitor/assets reads assets/, which is committed and holds the
          # same 1024x1024 sources Android uses, so both platforms cannot drift
          # apart. assets/icon.png is already flattened to RGB - the App Store
          # rejects icons with an alpha channel.
          npm install @capacitor/assets
          node -e "const d=require('fs').readFileSync('assets/icon.png'); if(d[25]!==2){console.error('assets/icon.png must have no alpha channel (colortype 2), found '+d[25]);process.exit(1)} console.log('icon source OK: no alpha')"
          npx @capacitor/assets generate --ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
